[package]
name = "deadlock-launcher"
version = "1.0.0"
edition = "2021"
description = "ShaurMeaw — кастомный лаунчер для Deadlock"

[[bin]]
name = "ShaurMeaw"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
rfd = { version = "0.15", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
mimalloc = { version = "0.1", default-features = false }
crossbeam-channel = { version = "0.5", default-features = false, features = ["std"] }
log = { version = "0.4", default-features = false, features = ["release_max_level_off"] }
tracing = { version = "0.1", default-features = false, features = ["release_max_level_off"] }
semver = "1.0"
ureq = { version = "2.10", features = ["json"] }

[build-dependencies]
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.55", default-features = false }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.libmimalloc-sys]
opt-level = 3
